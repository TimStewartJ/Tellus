plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.1'
	id 'maven-publish'
}

ext.tellus = [
	minecraftVersion: '26.2',
	loaderVersion: '0.19.3',
	fabricVersion: '0.152.1+26.2',
	fabricDependencyConfiguration: 'implementation',
	javaVersion: 25,
	distantHorizonsRuntimeProperty: 'mc262_distant_horizons_runtime_path',
	sharedSourceLayers: ['post-1201', 'mc262', 'fabric'],
	mapboxVersion: '24.1.1',
	protobufVersion: '4.28.2',
	officialMappings: false,
	testDistantHorizonsRuntime: true,
]

apply from: rootProject.file('gradle/tellus-fabric.gradle')

tasks.register('simulateFastLodDataLoading', JavaExec) {
	group = 'verification'
	description = 'Profiles Tellus source loading for Fast LODs at experimental 1:1 height without starting Minecraft.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yucareux.tellus.worldgen.FastLodDataLoadingSimulation'
	maxHeapSize = '2g'
	jvmArgs '-Dtellus.experimentalHeight.coordinateProfile=global_mercator_land_v2'
	def defaultSimulationGameDir = layout.buildDirectory.dir('lod-simulation-game').get().asFile.absolutePath
	def simulationGameDir = providers.gradleProperty('simGameDir').getOrElse(defaultSimulationGameDir)
	systemProperty 'tellus.gameDir', simulationGameDir
	systemProperty 'tellus.configDir', new File(simulationGameDir, 'config').absolutePath
	args "--latitude=${providers.gradleProperty('simLatitude').getOrElse('20.6534')}"
	args "--longitude=${providers.gradleProperty('simLongitude').getOrElse('-105.2253')}"
	args "--grid=${providers.gradleProperty('simGrid').getOrElse('64')}"
	args "--details=${providers.gradleProperty('simDetails').getOrElse('0,4,6,8,11')}"
}

tasks.register('benchmarkChunkGeneration', JavaExec) {
	group = 'verification'
	description = 'Runs real EarthChunkGenerator createBiomes+fillFromNoise on ProtoChunks headlessly and reports per-chunk timings.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yucareux.tellus.worldgen.ChunkGenerationBenchmark'
	maxHeapSize = providers.gradleProperty('benchHeap').getOrElse('8g')
	jvmArgs '-Dtellus.experimentalHeight.coordinateProfile=global_mercator_land_v2'
	jvmArgs "-Dtellus.debug.fullChunkPerf=${providers.gradleProperty('benchFullChunkPerf').getOrElse('true')}"
	jvmArgs "-Dtellus.chunkgen.timing=${providers.gradleProperty('benchChunkTiming').getOrElse('false')}"
	jvmArgs "-Dtellus.chunkgen.timingThresholdMs=${providers.gradleProperty('benchChunkTimingThresholdMs').getOrElse('0')}"
	jvmArgs "-Dtellus.debug.chunkDetailPerf=${providers.gradleProperty('benchChunkDetailPerf').getOrElse('true')}"
	jvmArgs "-Dtellus.debug.osmPerf=${providers.gradleProperty('benchOsmPerf').getOrElse('false')}"
	def extraJvmArgs = providers.gradleProperty('benchJvmArgs').orNull
	if (extraJvmArgs) {
		jvmArgs extraJvmArgs.split(' ')
	}
	def defaultBenchGameDir = layout.buildDirectory.dir('chunkgen-benchmark-game').get().asFile.absolutePath
	def benchGameDir = providers.gradleProperty('benchGameDir').getOrElse(defaultBenchGameDir)
	systemProperty 'tellus.gameDir', benchGameDir
	systemProperty 'tellus.configDir', new File(benchGameDir, 'config').absolutePath
	args "--latitude=${providers.gradleProperty('benchLatitude').getOrElse('37.75641472133222')}"
	args "--longitude=${providers.gradleProperty('benchLongitude').getOrElse('-119.59291934967041')}"
	args "--radius=${providers.gradleProperty('benchRadius').getOrElse('4')}"
	args "--passes=${providers.gradleProperty('benchPasses').getOrElse('2')}"
	args "--threads=${providers.gradleProperty('benchThreads').getOrElse('1')}"
	args "--profile=${providers.gradleProperty('benchProfile').getOrElse('yosemite')}"
	args "--scale=${providers.gradleProperty('benchScale').getOrElse('1.0')}"
	args "--experimentalHeight=${providers.gradleProperty('benchExperimentalHeight').getOrElse('true')}"
	args "--prefetch=${providers.gradleProperty('benchPrefetch').getOrElse('false')}"
	args "--perChunk=${providers.gradleProperty('benchPerChunk').getOrElse('false')}"
	args "--warmupRadius=${providers.gradleProperty('benchWarmupRadius').getOrElse('-1')}"
	args "--warmupOffsetChunks=${providers.gradleProperty('benchWarmupOffsetChunks').getOrElse('256')}"
}

tasks.register('benchmarkTileDecode', JavaExec) {
	group = 'verification'
	description = 'Measures read + WebP decode cost per cached Mapterhorn tile.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yucareux.tellus.world.data.elevation.TileDecodeBenchmark'
	args providers.gradleProperty('tileDir').getOrElse(layout.buildDirectory.dir('chunkgen-benchmark-game/tellus/cache/elevation-mapterhorn').get().asFile.absolutePath)
	args providers.gradleProperty('tileRounds').getOrElse('4')
}

tasks.register('benchmarkCarverPreparation', JavaExec) {
	group = 'verification'
	description = 'Measures vanilla cave-field planning serialized versus in parallel fill workers.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yucareux.tellus.worldgen.CarverPreparationBenchmark'
	maxHeapSize = providers.gradleProperty('carverBenchHeap').getOrElse('4g')
	def extraJvmArgs = providers.gradleProperty('carverBenchJvmArgs').orNull
	if (extraJvmArgs) {
		jvmArgs extraJvmArgs.split(' ')
	}
	args "--radius=${providers.gradleProperty('carverBenchRadius').getOrElse('6')}"
	args "--threads=${providers.gradleProperty('carverBenchThreads').getOrElse('16')}"
	args "--rounds=${providers.gradleProperty('carverBenchRounds').getOrElse('3')}"
}
