plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
	id 'maven-publish'
}

ext.tellus = [
	minecraftVersion: '1.21.1',
	loaderVersion: '0.15.11',
	fabricVersion: '0.115.4+1.21.1',
	fabricDependencyConfiguration: 'modImplementation',
	javaVersion: 21,
	distantHorizonsRuntimeProperty: 'mc1211_distant_horizons_runtime_path',
	sharedSourceLayers: ['post-1201', 'pre-26', 'mc1211', 'fabric', 'pre-26-fabric'],
	mapboxVersion: '24.1.1',
	protobufVersion: '4.28.2',
	officialMappings: true,
	testDistantHorizonsRuntime: true,
]

apply from: rootProject.file('gradle/tellus-fabric.gradle')
